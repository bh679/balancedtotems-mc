// Balanced Totems: NeoForge 26.3 gameplay mod (branch mc26.3; main stays NeoForge 1.21.1).
//
// Totems of Undying that save you like the vanilla one but leave a curse behind
// (weakness, fatigue, heartbreak, blindness, morphing, zombified), plus a Void
// Totem. Dungeon Train bundles it (jar-in-jar) and points the Void Totem at the train.

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

group = mod_group_id

// Jar name: build/libs/balancedtotems-neoforge-<version>+mc26.3.jar. The +mc suffix keeps it
// apart from main's 1.21.1 jar, whose bare name Dungeon Train resolves.
base {
    archivesName = "${mod_id}-neoforge"
}
version = "${mod_version}+mc${minecraft_version}"

// Minecraft 26.x ships Java 25 to end users.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    exclude '**/CLAUDE.md'   // authoring docs — never a MC resource
}

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version

    // 26.x ships deobfuscated names, so no Parchment.

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
        }

        // ./gradlew runGameTestServer: runs gametest/BalancedTotemsGameTests and exits.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.named(mod_id)
    }
}

dependencies {
    // Unit tests — JUnit 5 Jupiter (pure-logic only; no live ModList).
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Generate neoforge.mods.toml from its template.
tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version       : minecraft_version,
        minecraft_version_range : minecraft_version_range,
        neo_version             : neo_version,
        loader_version_range    : loader_version_range,
        mod_id                  : mod_id,
        mod_name                : mod_name,
        mod_license             : mod_license,
        mod_version             : mod_version,
        mod_authors             : mod_authors,
        mod_description         : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir tasks.named('generateModMetadata')
neoForge.ideSyncTask tasks.named('generateModMetadata')

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'    : mod_id,
            'Specification-Vendor'   : mod_authors,
            'Specification-Version'  : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.jar.archiveVersion,
            'Implementation-Vendor'  : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xmaxerrs' << '1000'
}
